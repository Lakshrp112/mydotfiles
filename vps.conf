# vps.conf: Server configuration variant
# Combines personal shell ergonomics with Podman, AI, Cloudflare tunnels, and server security
# ==============================================================================

[config]
# Active package groups
groups = core, shell, sys-info, utilities, dev-tools, security-and-net, package-managers, runtimes, ai-agents

# Explicit packages to install
packages = bash-completion, git, git-lfs, gpg, curl, wget, tar, zip, unzip, 7z, zstd, procps, file, stow, swap, mise, starship, tmux, fzf, zoxide, atuin, ripgrep, fd, sd, bat, eza, duf, dust, procs, bottom, delta, rip2, ttyd, sesh, uv, python3, node, bun, golang, rust, build-essential, clang, cmake, ninja, ccache, gdb, sdkman, java, kotlin, ncdu, inxi, lshw, bandwhich, ssh, sshd, ufw, crowdsec, tailscale, cloudflared, bore, caddy, mosh, age, gopass, podman, podman-compose, gh, gitbutler, jq, direnv, hyperfine, grex, just, fastfetch, rsync, rclone, croc, gping, asciinema, cursor-cli, antigravity-cli, codex-cli, opencode-cli, llama-cpp

# Excluded packages (stripped desktop, docker, and unneeded tools)
exclude = ollama, docker, docker-compose, dotnet, herdr, tealdeer, xh, deno, dokploy, claude-code-cli

# ── Git Defaults ──────────────────────────────────────────────────────────────
[package:gitconfig]
git_default_branch = main

# ── Readline Configuration (GNU Readline) ─────────────────────────────────────
[template:.inputrc:override]
$include /etc/inputrc

# General & Performance
set keyseq-timeout 0
set bell-style none

# Completion Logic
set completion-ignore-case on
set completion-map-case on
set show-all-if-ambiguous on
set show-all-if-unmodified on
set completion-query-items 200
set match-hidden-files off
set skip-completed-text on
set echo-control-characters off
set expand-tilde on

# Visual Feedback
set colored-stats on
set colored-completion-prefix on
set visible-stats on
set mark-directories on
set mark-symlinked-directories on

# Keybindings & Navigation
"\t": menu-complete
"\e[Z": menu-complete-backward
"\e[A": history-search-backward
"\e[B": history-search-forward
"\e[1;5C": forward-word
"\e[1;5D": backward-word
"\e[1;3C": forward-word
"\e[1;3D": backward-word

# ── Starship Prompt Configuration (Server-Optimized) ──────────────────────────
[template:~/.config/starship.toml:override]
add_newline = true
command_timeout = 1000
scan_timeout = 1000

format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$docker_context\
$nodejs\
$bun\
$deno\
$python\
$golang\
$rust\
$c\
$memory_usage\
$jobs\
$cmd_duration\
$character\
"""

[os]
disabled = false
style = "bold white"
[os.symbols]
Ubuntu = "[ ](bold fg:208)"
Debian = "[ ](bold red)"
Arch = "[ ](bold cyan)"
Fedora = "[ ](bold blue)"
Alpine = "[ ](bold blue)"

[username]
show_always = true
style_user = "bold blue"
style_root = "bold red"
format = "[$user]($style)@"

[hostname]
ssh_only = false
trim_at = ".local"
style = "bold yellow"
format = "[$hostname]($style) "

[directory]
truncation_length = 3
truncation_symbol = "…/"
fish_style_pwd_dir_length = 1
style = "bold purple"
read_only = " "
format = "[$path]($style)[$read_only]($style) "

[git_branch]
symbol = " "
style = "bold green"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold yellow"
conflicted = " "
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
untracked = "?${count}"
modified = "!${count}"
staged = "+${count}"
format = "([$all_status$ahead_behind]($style) )"

[docker_context]
symbol = " "
style = "bold blue"
format = "[$symbol$context]($style) "
only_with_files = true

[nodejs]
symbol = " "
style = "bold green"
detect_files = ["package.json", ".node-version"]
format = "[$symbol($version )]($style)"

[bun]
symbol = " "
style = "bold red"
detect_files = ["bun.lockb", "bunfig.toml"]
format = "[$symbol($version )]($style)"

[deno]
symbol = " "
style = "bold green"
detect_files = ["deno.json", "deno.jsonc", "deps.ts"]
format = "[$symbol($version )]($style)"

[python]
symbol = " "
style = "bold yellow"
detect_files = ["requirements.txt", "pyproject.toml", "uv.lock"]
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[golang]
symbol = " "
style = "bold cyan"
detect_files = ["go.mod", "main.go"]
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
style = "bold red"
detect_files = ["Cargo.toml"]
format = "[$symbol($version )]($style)"

[c]
symbol = " "
style = "bold blue"
detect_files = ["Makefile", "CMakeLists.txt"]
format = "[$symbol($version )]($style)"

[memory_usage]
disabled = false
threshold = 80
symbol = " "
style = "bold red"
format = "[$symbol${ram}]($style) "

[jobs]
symbol = " "
style = "bold red"
number_threshold = 1
format = "[$symbol$number]($style) "

[cmd_duration]
min_time = 2000
style = "bold yellow"
format = "took [$duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[✘ $status ❯](bold red)"
vicmd_symbol = "[❮](bold yellow)"

# ── Git Configuration (Terminal CLI & Delta Pager) ────────────────────────────
[template:~/.config/git/config:override]
[core]
	editor = ${EDITOR:-vi}
	autocrlf = input
	excludesfile = ~/.config/git/ignore
	attributesfile = ~/.config/git/attributes

[init]
	defaultBranch = main

[color]
	ui = auto

[fetch]
	prune = true
	pruneTags = true

[push]
	autoSetupRemote = true
	followTags = true

[pull]
	rebase = true

[rerere]
	enabled = true

[commit]
	verbose = true

[branch]
	sort = -committerdate

[tag]
	sort = version:refname

[column]
	ui = auto

[help]
	autocorrect = 1

[diff]
	algorithm = histogram
	colorMoved = default

[merge]
	conflictstyle = zdiff3

[include]
	path = ~/.config/git/delta.gitconfig

[alias]
	st = status -sb
	co = checkout
	last = log -1 HEAD --stat
	amend = commit --amend --no-edit
	unstage = restore --staged
	lg = log --graph --pretty=format:'%Cred%h%Creset -%C(yellow)%d%Creset %s %Cgreen(%cr) %C(bold blue)<%an>%Creset' --abbrev-commit
	undo = reset --soft HEAD~1

# ── FZF Configuration ─────────────────────────────────────────────────────────
[template:~/.fzfrc:override]
export FZF_DEFAULT_OPTS="--height=40% --layout=reverse --border=rounded --preview-window=right:60%:wrap --bind='ctrl-/:toggle-preview' --color=fg:#c0caf5,bg:-1,hl:#7aa2f7 --color=fg+:#c0caf5,bg+:#292e42,hl+:#7dcfff"

if command -v fd >/dev/null 2>&1; then
    export FZF_DEFAULT_COMMAND="fd --type f --strip-cwd-prefix --hidden --exclude .git"
    export FZF_CTRL_T_COMMAND="$FZF_DEFAULT_COMMAND"
    export FZF_ALT_C_COMMAND="fd --type d --strip-cwd-prefix --hidden --exclude .git"
elif command -v rg >/dev/null 2>&1; then
    export FZF_DEFAULT_COMMAND='rg --files --hidden --follow --glob "!.git/*"'
    export FZF_CTRL_T_COMMAND="$FZF_DEFAULT_COMMAND"
fi

if command -v bat >/dev/null 2>&1 || command -v batcat >/dev/null 2>&1; then
    _BAT_BIN="$(command -v bat || command -v batcat)"
    export FZF_CTRL_T_OPTS="--preview '$_BAT_BIN --style=numbers --color=always --line-range :200 {}'"
fi
if command -v eza >/dev/null 2>&1; then
    export FZF_ALT_C_OPTS="--preview 'eza --tree --level=2 --color=always {}'"
fi

# ── Tmux Configuration (TokyoNight Theme & Modern Ergonomics) ────────────────
[template:~/.tmux.conf:override]
set -g mouse on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# TokyoNight Palette
set -g status-style bg=default,fg="#c0caf5"
set -g status-left "#[bold,fg=#7aa2f7] 󰒋 #S #[default] "
set -g status-right "#[fg=#e0af68]%H:%M #[fg=#565f89]| #[fg=#9ece6a]%d-%b"
set -g window-status-current-format "#[bold,fg=#7aa2f7] #I:#W* "
set -g window-status-format "#[fg=#565f89] #I:#W "

# ── Unified Shell Environment (VPS Server) ────────────────────────────────────
[bashrc:append]
# Shell Options
shopt -s histappend checkwinsize 2>/dev/null
shopt -s globstar cdspell 2>/dev/null

# ── 1. Paths & Runtimes ───────────────────────────────────────────────────────
export CARGO_HOME="${XDG_DATA_HOME:-$HOME/.local/share}/cargo"
export CARGO_INSTALL_ROOT="$HOME/.local"
export GOBIN="$HOME/.local/bin"
export GRADLE_USER_HOME="${XDG_DATA_HOME:-$HOME/.local/share}/gradle"
export FNM_DIR="${XDG_DATA_HOME:-$HOME/.local/share}/fnm"
export BUN_INSTALL="${XDG_DATA_HOME:-$HOME/.local/share}/bun"
export UV_INSTALL_DIR="${XDG_DATA_HOME:-$HOME/.local/share}/uv"

[ -d "/usr/lib/ccache" ] && _add_to_path "/usr/lib/ccache"
[ -d "$BUN_INSTALL/bin" ] && _add_to_path "$BUN_INSTALL/bin"
[ -d "$HOME/.local/share/uv" ] && [ -f "$HOME/.local/share/uv/env" ] && . "$HOME/.local/share/uv/env"

# C/C++ Defaults
if command -v clang >/dev/null 2>&1; then
    export CC=clang
    export CXX=clang++
fi

# Golang Defaults
if [ -d "/usr/local/go" ]; then
    export GOROOT="/usr/local/go"
    export GOPATH="$HOME/go"
    export GOTOOLCHAIN="auto"
    _add_to_path "$GOROOT/bin"
    _add_to_path "$GOPATH/bin"
fi

# SDKMAN
export SDKMAN_DIR="${XDG_DATA_HOME:-$HOME/.local/share}/sdkman"
[[ -s "$SDKMAN_DIR/bin/sdkman-init.sh" ]] && . "$SDKMAN_DIR/bin/sdkman-init.sh"

# ── 2. Modern CLI Overrides & Aliases ─────────────────────────────────────────
if command -v eza >/dev/null 2>&1; then
    alias ls='eza --icons --group-directories-first'
    alias ll='eza -alF --icons --group-directories-first'
    alias la='eza -A --icons'
    alias l='eza -F --icons'

    tree() {
        if [ "$#" -eq 0 ]; then
            eza --tree --level=2 --icons --git-ignore -I ".git|node_modules|__pycache__|target|dist"
        elif [[ "$1" =~ ^[0-9]+$ ]]; then
            eza --tree --level="$1" --icons --git-ignore -I ".git|node_modules|__pycache__|target|dist" "${@:2}"
        else
            eza --tree --icons --git-ignore -I ".git|node_modules|__pycache__|target|dist" "$@"
        fi
    }
fi

if command -v rg >/dev/null 2>&1; then
    alias grep='rg'
fi

if command -v bat >/dev/null 2>&1 || command -v batcat >/dev/null 2>&1; then
    _BAT_EXEC="$(command -v bat || command -v batcat)"
    alias cat="$_BAT_EXEC --style=plain,numbers --paging=never"
    export MANPAGER="sh -c 'col -bx | $_BAT_EXEC -l man -p'"
fi

if command -v zoxide >/dev/null 2>&1; then
    _eval_cached zoxide zoxide init bash
    alias cd='z'
fi

if command -v direnv >/dev/null 2>&1; then
    _eval_cached direnv direnv hook bash
fi

# Modern CLI Utilities
command -v btm >/dev/null 2>&1 && alias top='btm' && alias htop='btm'
command -v dust >/dev/null 2>&1 && alias du='dust'
command -v duf >/dev/null 2>&1 && alias df='duf'
command -v gping >/dev/null 2>&1 && alias ping='gping'
command -v procs >/dev/null 2>&1 && alias p='procs'
command -v rip >/dev/null 2>&1 && alias trash='rip'

# Container (Podman) Aliases & Shims
if command -v podman >/dev/null 2>&1; then
    alias docker='podman'
    alias docker-compose='podman-compose'
    alias pman='podman'
    alias pc='podman-compose'
    alias pps='podman ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"'
    alias plogs='podman logs -f --tail=100'
fi

# Server Monitoring & Diagnostics
alias mem='free -h'
command -v bandwhich >/dev/null 2>&1 && alias band='sudo bandwhich'
command -v ncdu >/dev/null 2>&1 && alias disk='ncdu -x /'

# Systemd & Journal Shortcuts
alias sc='sudo systemctl'
alias scu='systemctl --user'
alias jc='sudo journalctl -eu'
alias jf='sudo journalctl -fu'

# Smart Tmux Auto-Attach
tm() {
    tmux attach-session -t "${1:-main}" 2>/dev/null || tmux new-session -s "${1:-main}"
}

# Audit-Grade Shell History (Incident Post-Mortems)
export HISTTIMEFORMAT="%F %T "
export HISTCONTROL=ignoreboth:erasedups
export HISTSIZE=50000
export HISTFILESIZE=100000

# Safety & DX
alias rm='rm -I'
alias sudo='sudo '
alias myip='curl -s https://ifconfig.me; echo'
alias localip="ip -4 addr show scope global | awk '/inet/ {print \$2}'"
alias ports='sudo ss -tulpn 2>/dev/null || ss -tulpn'
alias headers='curl -sSL -D - -o /dev/null'
alias flushdns='sudo resolvectl flush-caches 2>/dev/null || sudo systemd-resolve --flush-caches 2>/dev/null'
alias reboot-needed='[ -f /var/run/reboot-required ] && cat /var/run/reboot-required || echo "✅ No reboot needed."'
alias fw='sudo ufw status verbose'
alias cs='sudo cscli alerts list'
alias csb='sudo cscli decisions list'
alias reload='exec $SHELL -l'

# ── 3. Python Ecosystem & Auto-Venv (uv) ───────────────────────────────────────
_auto_venv() {
    local venv_path=""
    if [ -f "./.venv/bin/activate" ]; then
        venv_path="./.venv/bin/activate"
    elif [ -f "./venv/bin/activate" ]; then
        venv_path="./venv/bin/activate"
    fi

    if [ -n "$venv_path" ]; then
        if [ "$VIRTUAL_ENV" != "$(readlink -f "${venv_path%/*/*}")" ]; then
            . "$venv_path"
        fi
    elif [ -n "$VIRTUAL_ENV" ]; then
        deactivate
    fi
}
PROMPT_COMMAND="_auto_venv${PROMPT_COMMAND:+;$PROMPT_COMMAND}"

if command -v uv >/dev/null 2>&1; then
    alias pip='uv pip'
    alias pip3='uv pip'
    alias venv='uv venv'
    alias virtualenv='uv venv'
    alias pipx='uv tool'

    python() {
        if [[ "$1" == "-m" && "$2" == "pip" ]]; then
            shift 2; uv pip "$@"
        elif [[ "$1" == "-m" && "$2" == "venv" ]]; then
            shift 2; uv venv "$@"
        else
            command python "$@"
        fi
    }
    python3() {
        if [[ "$1" == "-m" && "$2" == "pip" ]]; then
            shift 2; uv pip "$@"
        elif [[ "$1" == "-m" && "$2" == "venv" ]]; then
            shift 2; uv venv "$@"
        else
            command python3 "$@"
        fi
    }
fi

# ── 4. Universal Utilities ───────────────────────────────────────────────────
mkcd() {
    mkdir -p "$1" && cd "$1" || return 1
}

extract() {
    if [ -f "$1" ]; then
        case "$1" in
            *.tar.bz2|*.tbz2) tar xjf "$1" ;;
            *.tar.gz|*.tgz)   tar xzf "$1" ;;
            *.tar.xz)         tar xf "$1" ;;
            *.tar.zst)        tar --zstd -xf "$1" ;;
            *.tar)            tar xf "$1" ;;
            *.zip)            unzip "$1" ;;
            *.7z)             7z x "$1" ;;
            *.rar)            unrar x "$1" ;;
            *.gz)             gunzip "$1" ;;
            *.bz2)            bunzip2 "$1" ;;
            *) echo "❌ Error: '$1' unrecognized archive format." ;;
        esac
    else
        echo "❌ Error: '$1' is not a valid file."
    fi
}
