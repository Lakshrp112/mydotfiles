# custom.conf: Unified configuration for WSL & Native Linux CLI
# Merges rigrc defaults (caching, safety, modular engine) with custom setup
# ==============================================================================

[config]
# Active package groups
groups = core, shell, sys-info, utilities, dev-tools, security-and-net, package-managers, runtimes, ai-agents

# Explicit packages to install
packages = bash-completion, git, git-lfs, gpg, curl, wget, tar, zip, unzip, 7z, zstd, procps, file, stow, swap, mise, starship, fzf, zoxide, atuin, ripgrep, fd, sd, bat, eza, duf, dust, procs, bottom, delta, rip2, ttyd, uv, python3, node, bun, golang, rust, build-essential, clang, cmake, ninja, ccache, gdb, sdkman, java, kotlin, ncdu, inxi, lshw, bandwhich, ssh, bore, mosh, age, gopass, dokploy, gh, gitbutler, jq, direnv, hyperfine, grex, just, fastfetch, rsync, rclone, croc, gping, asciinema, cursor-cli, antigravity-cli, codex-cli, opencode-cli

# Excluded packages
exclude = llama-cpp, ollama, docker, docker-compose, podman, podman-compose, dotnet, caddy, cloudflared, crowdsec, sshd, tailscale, ufw, herdr, sesh, tmux, tealdeer, xh, deno, claude-code-cli

# ── Git Defaults ──────────────────────────────────────────────────────────────
[package:gitconfig]
git_default_branch = main

# ── Readline Configuration (GNU Readline) ─────────────────────────────────────
[template:.inputrc:override]
$include /etc/inputrc

# General & Performance
set keyseq-timeout 0
set bell-style none

# Completion Logic
set completion-ignore-case on
set completion-map-case on
set show-all-if-ambiguous on
set show-all-if-unmodified on
set completion-query-items 200
set match-hidden-files off
set skip-completed-text on
set echo-control-characters off
set expand-tilde on

# Visual Feedback
set colored-stats on
set colored-completion-prefix on
set visible-stats on
set mark-directories on
set mark-symlinked-directories on

# Keybindings & Navigation
"\t": menu-complete
"\e[Z": menu-complete-backward
"\e[A": history-search-backward
"\e[B": history-search-forward
"\e[1;5C": forward-word
"\e[1;5D": backward-word
"\e[1;3C": forward-word
"\e[1;3D": backward-word

# ── Starship Prompt Configuration ─────────────────────────────────────────────
[template:~/.config/starship.toml:override]
add_newline = true
command_timeout = 1000
scan_timeout = 1000

format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$aws\
$gcloud\
$azure\
$openstack\
$nodejs\
$bun\
$deno\
$php\
$python\
$golang\
$rust\
$c\
$dotnet\
$swift\
$package\
$docker_context\
$memory_usage\
$jobs\
$cmd_duration\
$character\
"""

[os]
disabled = false
style = "bold white"
[os.symbols]
Ubuntu = "[ ](bold fg:208)"
Debian = "[ ](bold red)"
Arch = "[ ](bold cyan)"
Fedora = "[ ](bold blue)"
Alpine = "[ ](bold blue)"
Macos = "[ ](bold white)"
Windows = "[ ](bold fg:33)"

[username]
show_always = true
style_user = "bold blue"
style_root = "bold red"
format = "[$user]($style) "

[hostname]
ssh_only = true
style = "bold dim white"
format = "[$ssh_symbol$hostname]($style) "
ssh_symbol = "@ "

[directory]
truncation_length = 3
truncation_symbol = "…/"
fish_style_pwd_dir_length = 1
style = "bold purple"
read_only = " "
format = "[$path]($style)[$read_only]($style) "

[git_branch]
symbol = " "
style = "bold green"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold yellow"
ignore_submodules = true
conflicted = " "
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
untracked = "?${count}"
modified = "!${count}"
staged = "+${count}"
format = "([$all_status$ahead_behind]($style) )"

[aws]
disabled = true
[gcloud]
disabled = true
[azure]
disabled = true
[openstack]
disabled = true

[nodejs]
symbol = " "
style = "bold green"
detect_files = ["package.json", ".node-version"]
format = "[$symbol($version )]($style)"

[bun]
symbol = " "
style = "bold red"
detect_files = ["bun.lockb", "bunfig.toml"]
format = "[$symbol($version )]($style)"

[deno]
symbol = " "
style = "bold green"
detect_files = ["deno.json", "deno.jsonc", "deps.ts"]
format = "[$symbol($version )]($style)"

[php]
disabled = true

[python]
symbol = " "
style = "bold yellow"
detect_files = ["requirements.txt", "pyproject.toml", "uv.lock"]
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[golang]
symbol = " "
style = "bold cyan"
detect_files = ["go.mod", "main.go"]
format = "[$symbol($version )]($style)"
disabled = false

[rust]
symbol = " "
style = "bold red"
detect_files = ["Cargo.toml"]
format = "[$symbol($version )]($style)"

[c]
symbol = " "
style = "bold blue"
detect_files = ["Makefile", "CMakeLists.txt"]
format = "[$symbol($version )]($style)"

[dotnet]
disabled = true
[swift]
disabled = true

[docker_context]
symbol = " "
style = "blue dimmed"
format = "[$symbol$context]($style) "
only_with_files = true

[memory_usage]
disabled = false
threshold = 80
symbol = " "
style = "bold red"
format = "[$symbol${ram}]($style) "

[jobs]
symbol = " "
style = "bold red"
number_threshold = 1
format = "[$symbol$number]($style) "

[cmd_duration]
min_time = 2000
style = "bold yellow"
format = "took [$duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[✘ $status ❯](bold red)"
vicmd_symbol = "[❮](bold yellow)"

# ── Git Configuration ─────────────────────────────────────────────────────────
[template:~/.config/git/config:override]
[core]
	editor = code --wait
	autocrlf = input
	excludesfile = ~/.config/git/ignore
	attributesfile = ~/.config/git/attributes

[init]
	defaultBranch = main

[color]
	ui = auto

[fetch]
	prune = true
	pruneTags = true

[push]
	autoSetupRemote = true
	followTags = true

[pull]
	rebase = true

[rerere]
	enabled = true

[commit]
	verbose = true

[branch]
	sort = -committerdate

[tag]
	sort = version:refname

[column]
	ui = auto

[help]
	autocorrect = 1

[diff]
	algorithm = histogram
	colorMoved = default
	tool = vscode

[difftool "vscode"]
	cmd = code --wait --diff $LOCAL $REMOTE

[merge]
	conflictstyle = zdiff3
	tool = vscode

[mergetool "vscode"]
	cmd = code --wait --merge $LOCAL $REMOTE $BASE $MERGED

[credential "https://github.com"]
	helper =
	helper = !/usr/bin/gh auth git-credential

[credential "https://gist.github.com"]
	helper =
	helper = !/usr/bin/gh auth git-credential

[include]
	path = ~/.config/git/delta.gitconfig
	path = ~/.config/git/gitbutler.gitconfig

[alias]
	st = status -sb
	co = checkout
	last = log -1 HEAD --stat
	amend = commit --amend --no-edit
	unstage = restore --staged
	lg = log --graph --pretty=format:'%Cred%h%Creset -%C(yellow)%d%Creset %s %Cgreen(%cr) %C(bold blue)<%an>%Creset' --abbrev-commit
	undo = reset --soft HEAD~1

# ── FZF Configuration ─────────────────────────────────────────────────────────
[template:~/.fzfrc:override]
export FZF_DEFAULT_OPTS="--height=40% --layout=reverse --border=rounded --preview-window=right:60%:wrap --bind='ctrl-/:toggle-preview' --color=fg:#c0caf5,bg:-1,hl:#7aa2f7 --color=fg+:#c0caf5,bg+:#292e42,hl+:#7dcfff"

if command -v fd >/dev/null 2>&1; then
    export FZF_DEFAULT_COMMAND="fd --type f --strip-cwd-prefix --hidden --exclude .git"
    export FZF_CTRL_T_COMMAND="$FZF_DEFAULT_COMMAND"
    export FZF_ALT_C_COMMAND="fd --type d --strip-cwd-prefix --hidden --exclude .git"
elif command -v rg >/dev/null 2>&1; then
    export FZF_DEFAULT_COMMAND='rg --files --hidden --follow --glob "!.git/*"'
    export FZF_CTRL_T_COMMAND="$FZF_DEFAULT_COMMAND"
fi

export FZF_CTRL_R_OPTS="
  --preview 'echo {}' --preview-window up:3:hidden:wrap
  --bind 'ctrl-/:toggle-preview'
  --bind 'ctrl-y:execute-silent(echo -n {2..} | (clip.exe || xclip -sel clip || wl-copy || true))+abort'
  --color header:italic
  --header 'Press CTRL-Y to copy command to Clipboard'"

if command -v bat >/dev/null 2>&1 || command -v batcat >/dev/null 2>&1; then
    _BAT_BIN="$(command -v bat || command -v batcat)"
    export FZF_CTRL_T_OPTS="--preview '$_BAT_BIN --style=numbers --color=always --line-range :200 {}'"
fi
if command -v eza >/dev/null 2>&1; then
    export FZF_ALT_C_OPTS="--preview 'eza --tree --level=2 --color=always {}'"
fi

# ── Host WSL2 Configuration ───────────────────────────────────────────────────
[template:~/.wslconfig:once:cond=wsl]
[wsl2]
networkingMode=mirrored
memory=13GB
processors=6
autoProxy=true

[experimental]
sparseVhd=true
dnsTunneling=true
autoMemoryReclaim=gradual
hostAddressLoopback=true

# ── Unified Shell Additions (WSL + Native CLI) ────────────────────────────────
[bashrc:append]
# Shell Options
shopt -s histappend checkwinsize 2>/dev/null
shopt -s globstar cdspell 2>/dev/null

# ── 1. Package Manager & Language Paths ───────────────────────────────────────
export CARGO_HOME="${XDG_DATA_HOME:-$HOME/.local/share}/cargo"
export CARGO_INSTALL_ROOT="$HOME/.local"
export GOBIN="$HOME/.local/bin"
export GRADLE_USER_HOME="${XDG_DATA_HOME:-$HOME/.local/share}/gradle"
export FNM_DIR="${XDG_DATA_HOME:-$HOME/.local/share}/fnm"
export BUN_INSTALL="${XDG_DATA_HOME:-$HOME/.local/share}/bun"
export UV_INSTALL_DIR="${XDG_DATA_HOME:-$HOME/.local/share}/uv"

[ -d "/usr/lib/ccache" ] && _add_to_path "/usr/lib/ccache"
[ -d "$BUN_INSTALL/bin" ] && _add_to_path "$BUN_INSTALL/bin"
[ -d "$HOME/.local/share/uv" ] && [ -f "$HOME/.local/share/uv/env" ] && . "$HOME/.local/share/uv/env"

# C/C++ Defaults
if command -v clang >/dev/null 2>&1; then
    export CC=clang
    export CXX=clang++
fi

# Golang Defaults
if [ -d "/usr/local/go" ]; then
    export GOROOT="/usr/local/go"
    export GOPATH="$HOME/go"
    export GOTOOLCHAIN="auto"
    _add_to_path "$GOROOT/bin"
    _add_to_path "$GOPATH/bin"
fi

# SDKMAN
export SDKMAN_DIR="${XDG_DATA_HOME:-$HOME/.local/share}/sdkman"
[[ -s "$SDKMAN_DIR/bin/sdkman-init.sh" ]] && . "$SDKMAN_DIR/bin/sdkman-init.sh"

# ── 2. Modern CLI Overrides & Aliases ─────────────────────────────────────────
if command -v eza >/dev/null 2>&1; then
    alias ls='eza --icons --group-directories-first'
    alias ll='eza -alF --icons --group-directories-first'
    alias la='eza -A --icons'
    alias l='eza -F --icons'

    tree() {
        if [ "$#" -eq 0 ]; then
            eza --tree --level=2 --icons --git-ignore -I ".git|node_modules|__pycache__|target|dist"
        elif [[ "$1" =~ ^[0-9]+$ ]]; then
            eza --tree --level="$1" --icons --git-ignore -I ".git|node_modules|__pycache__|target|dist" "${@:2}"
        else
            eza --tree --icons --git-ignore -I ".git|node_modules|__pycache__|target|dist" "$@"
        fi
    }
fi

if command -v rg >/dev/null 2>&1; then
    alias grep='rg'
fi

if command -v bat >/dev/null 2>&1 || command -v batcat >/dev/null 2>&1; then
    _BAT_EXEC="$(command -v bat || command -v batcat)"
    alias cat="$_BAT_EXEC --style=plain,numbers --paging=never"
    export MANPAGER="sh -c 'col -bx | $_BAT_EXEC -l man -p'"
fi

if command -v zoxide >/dev/null 2>&1; then
    _eval_cached zoxide zoxide init bash
    alias cd='z'
fi

if command -v direnv >/dev/null 2>&1; then
    _eval_cached direnv direnv hook bash
fi

# Modern CLI Utilities
command -v btm >/dev/null 2>&1 && alias top='btm' && alias htop='btm'
command -v dust >/dev/null 2>&1 && alias du='dust'
command -v duf >/dev/null 2>&1 && alias df='duf'
command -v gping >/dev/null 2>&1 && alias ping='gping'
command -v procs >/dev/null 2>&1 && alias p='procs'
command -v rip >/dev/null 2>&1 && alias trash='rip'

# Safety & DX
alias rm='rm -I'
alias sudo='sudo '
alias myip='curl -s https://ifconfig.me; echo'
alias headers='curl -sSL -D - -o /dev/null'
alias dot='cd ~/.dotfiles && stow -R --target="$HOME" --dir="$(pwd)" . 2>/dev/null && echo "✓ Dotfiles synced & Shell reloaded." && cd - > /dev/null && exec bash'
alias alert='notify-send --urgency=low -i "$([ $? = 0 ] && echo terminal || echo error)" "$(history|tail -n1|sed -e '\''s/^\s*[0-9]\+\s*//;s/[;&|]\s*alert$//'\'')"'

# ── 3. Python Ecosystem & Auto-Venv (uv) ───────────────────────────────────────
_auto_venv() {
    local venv_path=""
    if [ -f "./.venv/bin/activate" ]; then
        venv_path="./.venv/bin/activate"
    elif [ -f "./venv/bin/activate" ]; then
        venv_path="./venv/bin/activate"
    fi

    if [ -n "$venv_path" ]; then
        if [ "$VIRTUAL_ENV" != "$(readlink -f "${venv_path%/*/*}")" ]; then
            . "$venv_path"
        fi
    elif [ -n "$VIRTUAL_ENV" ]; then
        deactivate
    fi
}
PROMPT_COMMAND="_auto_venv${PROMPT_COMMAND:+;$PROMPT_COMMAND}"

if command -v uv >/dev/null 2>&1; then
    alias pip='uv pip'
    alias pip3='uv pip'
    alias venv='uv venv'
    alias virtualenv='uv venv'
    alias pipx='uv tool'

    python() {
        if [[ "$1" == "-m" && "$2" == "pip" ]]; then
            shift 2; uv pip "$@"
        elif [[ "$1" == "-m" && "$2" == "venv" ]]; then
            shift 2; uv venv "$@"
        else
            command python "$@"
        fi
    }
    python3() {
        if [[ "$1" == "-m" && "$2" == "pip" ]]; then
            shift 2; uv pip "$@"
        elif [[ "$1" == "-m" && "$2" == "venv" ]]; then
            shift 2; uv venv "$@"
        else
            command python3 "$@"
        fi
    }
fi

# ── 4. WSL Quality-of-Life Interop ───────────────────────────────────────────
if [ -n "${IS_WSL:-}" ] || [ -n "${WSL_DISTRO_NAME:-}" ]; then
    # Unified Open: Directories -> Explorer, Files -> Default App, URLs -> Browser
    open() {
        local target="${1:-.}"
        if [[ "$target" =~ ^https?:// ]]; then
            cmd.exe /c start "" "$target" 2>/dev/null || true
        elif [ -d "$target" ]; then
            explorer.exe "$(wslpath -w "$target" 2>/dev/null || echo "$target")" 2>/dev/null || true
        else
            cmd.exe /c start "" "$(wslpath -w "$target" 2>/dev/null || echo "$target")" 2>/dev/null || true
        fi
    }
    alias explorer='open'
    alias winstart='open'

    # Clipboard Bridge
    clip() {
        if [ -t 0 ] && [ -n "$1" ] && [ -f "$1" ]; then
            clip.exe < "$1" 2>/dev/null || true
        else
            clip.exe "$@" 2>/dev/null || true
        fi
    }
    alias copy='clip'
    alias pbcopy='clip'
    alias pbpaste='powershell.exe -NoProfile -Command Get-Clipboard 2>/dev/null'

    # Network Helpers
    alias hostip="ip route show 2>/dev/null | awk '/default/ {print \$3}'"
    alias wslip='hostip'

    # Windows User Directory Navigation
    if [ -n "$USERPROFILE" ]; then
        _WIN_HOME_PATH="$USERPROFILE"
    elif [ -d "/mnt/c/Users/$USER" ]; then
        _WIN_HOME_PATH="/mnt/c/Users/$USER"
    else
        _WIN_USERPROFILE=$(cmd.exe /c "echo %USERPROFILE%" 2>/dev/null | tr -d '\r')
        if [ -n "$_WIN_USERPROFILE" ]; then
            _WIN_HOME_PATH=$(wslpath "$_WIN_USERPROFILE" 2>/dev/null)
        else
            _WIN_HOME_PATH="/mnt/c/Users"
        fi
    fi

    winhome() {
        cd "${_WIN_HOME_PATH}${1:+/$1}" || return 1
    }
    alias cdw='winhome'
else
    if command -v xdg-open >/dev/null 2>&1; then
        alias open='xdg-open'
    else
        alias open='echo "❌ Error: open/xdg-open not available."'
    fi
    alias explorer='open'
    alias winstart='open'

    if command -v wl-copy >/dev/null 2>&1; then
        alias clip='wl-copy'
        alias copy='wl-copy'
        alias pbcopy='wl-copy'
        alias pbpaste='wl-paste'
    elif command -v xclip >/dev/null 2>&1; then
        alias clip='xclip -selection clipboard'
        alias copy='xclip -selection clipboard'
        alias pbcopy='xclip -selection clipboard'
        alias pbpaste='xclip -selection clipboard -o'
    else
        alias clip='echo "❌ Error: Clipboard utility (clip.exe/wl-copy/xclip) not available."'
        alias copy='clip'
        alias pbcopy='clip'
    fi

    alias wsl='echo "❌ Error: This command is only available in WSL."'
    alias winhome='wsl'
    alias cdw='wsl'
    alias hostip='wsl'
    alias wslip='wsl'
fi

# ── 5. Universal Utilities ───────────────────────────────────────────────────
mkcd() {
    mkdir -p "$1" && cd "$1" || return 1
}

extract() {
    if [ -f "$1" ]; then
        case "$1" in
            *.tar.bz2|*.tbz2) tar xjf "$1" ;;
            *.tar.gz|*.tgz)   tar xzf "$1" ;;
            *.tar.xz)         tar xf "$1" ;;
            *.tar.zst)        tar --zstd -xf "$1" ;;
            *.tar)            tar xf "$1" ;;
            *.zip)            unzip "$1" ;;
            *.7z)             7z x "$1" ;;
            *.rar)            unrar x "$1" ;;
            *.gz)             gunzip "$1" ;;
            *.bz2)            bunzip2 "$1" ;;
            *) echo "❌ Error: '$1' unrecognized archive format." ;;
        esac
    else
        echo "❌ Error: '$1' is not a valid file."
    fi
}
